<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>啾啾 · 听见你</title>
<style>
:root{font-family:system-ui,"Microsoft Yahei",sans-serif;color:#273b37;background:#f2f5ef}*{box-sizing:border-box}body{margin:0;padding:40px 24px}main{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.tag{font-size:13px;color:#53665e}h1{font-size:40px;letter-spacing:2px;margin:10px 0}p{line-height:1.7;color:#5d6b64}.pet{margin:32px auto 20px;display:grid;place-items:center;width:158px;height:142px;background:#e2eacb;border-radius:52px;box-shadow:0 12px 30px #2b423511;font-size:48px;letter-spacing:12px;padding-left:12px;transition:transform .2s}.pet.active{transform:rotate(-5deg) scale(1.035)}.center{text-align:center}h2{font-size:22px;margin:14px 0 6px}.meter{height:5px;max-width:190px;border-radius:5px;background:#dce5db;margin:18px auto 30px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#75885a;transition:width .1s}section{background:#fff;border:1px solid #dce4d7;border-radius:22px;padding:24px;margin-top:18px}.label{font-size:13px;color:#748074}.transcript{font-size:20px;min-height:50px;line-height:1.7;overflow-wrap:anywhere;margin:14px 0 0}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 0}button{font:inherit;cursor:pointer;min-height:46px;border:1px solid #d3ddce;background:#fff;color:#354534;border-radius:12px;padding:10px 17px}button:hover{background:#edf2e6}.primary{background:#344e3d;color:white;border-color:#344e3d}.primary:hover{background:#496348}button:disabled{opacity:.45;cursor:wait}.small{font-size:13px;margin-top:18px}#error{color:#9e4335;white-space:pre-wrap}footer{font-size:12px;color:#6f7c72;margin-top:24px;line-height:1.8}.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:#667463}@media(max-width:480px){body{padding:24px 16px}h1{font-size:34px}section{padding:20px}.pet{margin-top:26px}.buttons button{flex:1 1 40%}}
</style></head><body><main><div class="top"><span class="tag">一只会听你说话的电子小生物</span><span class="tag">本地运行</span></div><h1>啾啾</h1><p>你说人话，它用自己的声音回应。</p><div class="center"><div class="pet" id="pet" aria-hidden="true">• •</div><h2 id="phase">正在连接</h2><div class="tag" id="hint">持续聆听 · 无需唤醒词</div><div class="meter" aria-label="机器人收音电平"><i id="level"></i></div></div>
<section><div class="label">这一句，我听到的是</div><div class="transcript" id="text">对机器人说一句话吧。</div><div class="stats"><span id="asr">中文识别：等待说话</span><span id="latency"></span></div><div class="buttons"><button class="primary" id="mute">暂停聆听</button><button id="stop">停一下</button></div><p id="error" role="alert"></p></section>
<section><div class="label">试试它的种族声音</div><div class="buttons"><button data-kind="ack">啾 · 听到了</button><button data-kind="curious">咕啾？· 好奇</button><button data-kind="happy">啾哇 · 开心</button><button data-kind="sleepy">滋呜 · 困了</button></div><p class="small">短叫声和轻微电流质感，不说人话。你重新开口时，旧回应会停下。</p></section><footer>中文识别在这台电脑上完成，声音不上传云端。转写只显示当前一句，不保存录音。<br><span id="agent">自动短叫声表示“听到了”，语义服务尚未接入。</span></footer></main>
<script>
let state=null,busy=false;const $=id=>document.getElementById(id);const phases={starting:'刚刚醒来',listening:'我在听',hearing:'你说，我听着',recognizing:'听到了，认一下这句话',recovering:'正在重新连接机器人',error:'需要检查一下收音'};
async function action(path,body={}){if(busy&&path!=='interrupt')return;busy=true;try{const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error('操作未完成，请重试');await refresh()}catch(e){$('error').textContent=e.message}finally{busy=false}}
async function refresh(){try{const r=await fetch('/api/state');if(!r.ok)throw Error();state=await r.json();$('phase').textContent=state.muted?'安静待着':state.speaking?'啾啾！':phases[state.phase]||state.phase;$('hint').textContent=state.muted?'聆听已暂停':'持续聆听 · 无需唤醒词';$('text').textContent=state.text||(state.phase==='hearing'?'…':'对机器人说一句话吧。');$('mute').textContent=state.muted?'继续聆听':'暂停聆听';$('level').style.width=(state.muted?0:state.input_level*100)+'%';$('pet').classList.toggle('active',state.speaking||state.phase==='hearing');$('asr').textContent='中文识别：'+(state.asr_ms===null?'等待说话':state.asr_ms+' ms');$('latency').textContent=state.response_ms===null?'':'停顿至声音入队约 '+state.response_ms+' ms';$('error').textContent=state.error||'';$('agent').textContent=state.semantic_agent_connected?'语义服务已连接，由它选择回应的短叫声。':'自动短叫声表示“听到了”，语义服务尚未接入。';document.querySelectorAll('[data-kind]').forEach(b=>b.disabled=state.muted)}catch(e){$('phase').textContent='连接暂时中断';$('error').textContent='正在等待啾啾重新连接…'}}
$('mute').onclick=()=>state&&action('mute',{muted:!state.muted});$('stop').onclick=()=>action('interrupt');document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>action('audition',{kind:b.dataset.kind,expected_epoch:state?.epoch}));refresh();setInterval(refresh,300);
</script></body></html>
