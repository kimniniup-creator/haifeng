<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3eb">
  <title>海风 · 把今天的一小片，带回来</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/overrides.css">
</head>
<body>
  <div class="shell">
    <aside class="memory-rail" aria-label="片段列表">
      <div class="brand-lockup"><span class="brand-mark" aria-hidden="true">海</span><span>海风</span></div>
      <button class="new-memory" id="new-session" type="button"><span aria-hidden="true">＋</span> 新的片段</button>
      <nav class="session-nav" aria-label="已保存的片段"><p class="rail-label">留下的片段</p><div id="session-list" class="session-list"><p class="empty-list">还没有留下的片段。</p></div></nav>
      <div class="rail-actions"><button class="quiet-button" id="rename-open" type="button">为片段命名</button><button class="quiet-button danger-button" id="delete-open" type="button">删除当前片段</button><button class="quiet-button settings-launch" id="settings-open" type="button">设置</button></div>
    </aside>
    <main class="workspace">
      <header class="topline"><div><p class="eyebrow">与 Reachy 一起</p><h1>把今天的一小片，带回来。</h1></div><div id="connection-state" class="connection-state" aria-live="polite">正在连接本机海风…</div></header>
      <section class="memory-canvas" aria-labelledby="canvas-title">
        <div class="canvas-heading"><div><p class="eyebrow" id="canvas-title">这一刻</p><p id="image-caption" class="image-caption">今天，有什么想留下？</p></div><button id="clear-image" class="text-button hidden" type="button">不沿用这张照片</button></div>
        <div id="photo-stage" class="photo-stage empty-stage"><img id="photo-preview" class="photo-preview hidden" alt="当前片段中的照片"><div id="photo-empty" class="photo-empty"><svg viewBox="0 0 180 130" aria-hidden="true"><path d="M12 106c23-28 38-39 55-26 16 12 23 11 36-3 16-17 29-21 64 29"/><circle cx="118" cy="37" r="12"/><path d="M22 17h54M22 28h35M145 91h19"/></svg><p>还没有照片</p><span>从今天的光线开始，或者写下一句话。</span></div><div id="photo-progress" class="photo-progress hidden" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span id="photo-progress-text">正在从眼镜取回照片…</span></div></div>
        <div class="photo-actions"><label class="primary-button" for="photo-input">放一张照片</label><input id="photo-input" type="file" accept="image/jpeg,image/png" class="visually-hidden"><button id="capture" class="secondary-button" type="button">用眼镜拍一张</button></div><p id="image-meta" class="image-meta" aria-live="polite"></p>
      </section>
      <section class="conversation" aria-labelledby="conversation-title">
        <div class="conversation-heading"><div><p class="eyebrow" id="conversation-title">写给海风</p><p class="conversation-intro">打字写下这一刻；照片会随文字一起被带入对话。</p></div><span id="reuse-note" class="reuse-note hidden">这次沿用这张照片</span></div>
        <div id="message-list" class="message-list" aria-live="polite" aria-label="对话记录"></div>
        <form id="message-form" class="composer"><label class="visually-hidden" for="message-input">写给海风</label><textarea id="message-input" rows="2" maxlength="4000" placeholder="写下你想留下的这一刻…"></textarea><p class="privacy-note">发送时，文字和当前照片会交给你在本机设置的模型服务。</p><div class="composer-bottom"><p id="request-state" class="request-state" aria-live="polite"></p><div class="composer-actions"><button id="stop" class="text-button hidden" type="button">停止</button><button id="send" class="primary-button" type="submit">写给海风</button></div></div></form>
      </section>
    </main>
  </div>
  <dialog id="settings-dialog" aria-labelledby="settings-title"><form id="settings-form" method="dialog" class="settings-card"><div class="dialog-heading"><div><p class="eyebrow">本机设置</p><h2 id="settings-title">让海风看得见这一刻</h2></div><button class="icon-button" id="settings-close" type="button" aria-label="关闭设置">×</button></div><p class="settings-copy">你的文字和照片会发送到下方配置的模型服务。配置仅保存在这台电脑上。</p><label>模型服务地址<input id="model-base-url" name="base_url" type="url" placeholder="https://…" autocomplete="url"></label><label>API 密钥<input id="model-api-key" name="api_key" type="password" placeholder="只保存在本机" autocomplete="off"></label><label>视觉模型<input id="model-name" name="model" type="text" placeholder="支持图片的模型名称"></label><details class="token-details"><summary>本机连接令牌</summary><label>Bridge token<input id="bridge-token" type="password" placeholder="仅连接本机服务时需要" autocomplete="off"></label></details><p id="settings-status" class="settings-status" aria-live="polite"></p><div class="dialog-actions"><button id="settings-cancel" class="secondary-button" type="button">取消</button><button class="primary-button" type="submit">保存设置</button></div></form></dialog>
  <dialog id="rename-dialog" aria-labelledby="rename-title"><form id="rename-form" class="settings-card"><div class="dialog-heading"><div><p class="eyebrow">片段</p><h2 id="rename-title">为这一片命名</h2></div></div><label>名字<input id="session-name" maxlength="120" placeholder="例如：雨后的回家路"></label><p id="rename-status" class="settings-status" aria-live="polite"></p><div class="dialog-actions"><button id="rename-cancel" class="secondary-button" type="button">取消</button><button class="primary-button" type="submit">保存名字</button></div></form></dialog>
  <dialog id="delete-dialog" aria-labelledby="delete-title"><div class="settings-card"><p class="eyebrow">删除片段</p><h2 id="delete-title">删除这一片吗？</h2><p class="settings-copy">它的对话和照片会从这台电脑删除。</p><p id="delete-status" class="settings-status" aria-live="polite"></p><div class="dialog-actions"><button id="delete-cancel" class="secondary-button" type="button">保留</button><button id="delete-confirm" class="primary-button danger-fill" type="button">删除片段</button></div></div></dialog>
  <script src="/static/app.js" defer></script>
</body>
</html>
