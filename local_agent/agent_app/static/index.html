<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>一起看 · 本地 Agent</title><style>
body{font:16px/1.6 system-ui,sans-serif;background:#f3f5f1;color:#21342c;margin:0}main{max-width:1100px;margin:36px auto;padding:20px}h1{margin:0}small{color:#617369}.layout{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:20px}.card{background:white;border:1px solid #d8e2da;border-radius:18px;padding:22px;margin-bottom:16px}input,textarea,button{font:inherit;padding:10px;border:1px solid #b4c6b9;border-radius:9px;box-sizing:border-box}textarea{width:100%;min-height:86px}button{cursor:pointer;background:#e6eee8;margin:4px 4px 4px 0}button.primary{background:#285d46;color:white}button:disabled{opacity:.5;cursor:wait}#photo{max-width:100%;max-height:330px;border-radius:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#error{color:#a33333}article{border-bottom:1px solid #dde5df;padding:12px 0}article p{margin:5px 0}.memory{font-size:14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#chat{max-height:450px;overflow:auto}@media(max-width:760px){.layout{grid-template-columns:1fr}}
#details{max-height:360px;overflow:auto}input{max-width:100%}button{min-height:44px}.layout>*{min-width:0}@media(max-width:760px){main{margin:12px auto;padding:12px}.card{padding:16px}input[type=file]{width:100%}#token{width:100%}}
</style><main><h1>一起看</h1><small>主动分享一张照片，让桌上的伙伴参与这段经历。</small>
<div class="card" id="auth"><label>本地访问口令 <input id="token" type="password" placeholder=".env 中的 BRIDGE_TOKEN"></label> <button id="connect">连接</button><p><small>照片发送至你配置的模型 API；TTS 在 Windows 主机生成。机器人执行结果会单独显示。</small></p></div>
<div id="error"></div><div class="layout"><section><div class="card"><div class="row"><button id="new">新会话</button><label><input type="checkbox" id="quiet"> 安静模式</label><button id="stop">停止回应</button></div><p id="status">尚未连接</p><img id="photo" hidden><p><small id="imageLabel"></small></p><textarea id="text" placeholder="看看这个；或者：记住，这是我今天新买的植物。"></textarea><div class="row"><button class="primary" id="capture">拍照分享</button><button id="send">发送／针对这张图追问</button><input id="file" type="file" accept="image/jpeg,image/png,image/webp"></div><button id="upload">分享所选照片</button></div><div class="card"><h3>对话</h3><div id="chat"></div></div><details class="card"><summary>本轮观察与执行状态</summary><p id="mapping"></p><pre id="details"></pre></details></section>
<aside><div class="card"><h3>共同记忆</h3><button id="refresh">刷新记忆</button><div id="memories"></div></div><details class="card"><summary>设备状态</summary><button id="health">检查</button><pre id="healthText"></pre></details></aside></div></main>
<script>
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('agent-token')||'',sid=localStorage.getItem('agent-session')||'',iid=null,job=null,timer=null,blobUrl=null;
$('token').value=token;
async function api(path,options={}){const headers={'Authorization':'Bearer '+token,...options.headers};if(options.body && !(options.body instanceof FormData))headers['Content-Type']='application/json';const r=await fetch('/api'+path,{...options,headers});if(!r.ok)throw Error(await r.text());return r;}
async function data(path,options={}){return (await api(path,options)).json();}
function action(id,fn){$(id).onclick=async()=>{try{$('error').textContent='';await fn();}catch(e){$('error').textContent=e.message;}}}
function busy(value){for(const id of ['capture','send','upload','new'])$(id).disabled=value;}
async function showImage(id){if(iid===id&&!$('photo').hidden)return;iid=id;const image=await api('/images/'+id);if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(await image.blob());$('photo').src=blobUrl;$('photo').hidden=false;$('imageLabel').textContent='当前关联图片：'+id;}
async function history(){const s=await data('/sessions/'+sid);$('quiet').checked=!!s.quiet;$('chat').replaceChildren();for(const m of s.messages){if(!['user','assistant'].includes(m.role))continue;const a=document.createElement('article'),p=document.createElement('p'),label=document.createElement('small');label.textContent=m.role==='user'?'你':'伙伴';p.textContent=m.content.text||'分享了一张照片';a.append(label,p);$('chat').append(a);} $('chat').scrollTop=$('chat').scrollHeight;}
async function memories(){const r=await data('/memories');$('memories').replaceChildren();for(const m of r.memories){const a=document.createElement('article');a.className='memory';const p=document.createElement('p');p.textContent=m.text;const info=document.createElement('small');info.textContent=m.kind+' · '+new Date(m.created).toLocaleString();const edit=document.createElement('button');edit.textContent='更正';edit.onclick=async()=>{const text=prompt('修改这条记忆',m.text);if(text){try{await data('/memories/'+m.id,{method:'PATCH',body:JSON.stringify({text})});await memories();}catch(e){$('error').textContent=e.message;}}};const del=document.createElement('button');del.textContent='删除记忆';del.onclick=async()=>{try{await data('/memories/'+m.id,{method:'DELETE'});await memories();}catch(e){$('error').textContent=e.message;}};a.append(p,info,document.createElement('br'),edit,del);$('memories').append(a);}}
async function newSession(){sid=(await data('/sessions',{method:'POST'})).session_id;localStorage.setItem('agent-session',sid);iid=null;$('photo').hidden=true;$('imageLabel').textContent='';await history();}
async function poll(){if(!job)return;try{const r=await data('/jobs/'+job);$('status').textContent='本轮状态：'+r.status;$('details').textContent=JSON.stringify(r,null,2);const effect=r.result.expression_result;if(effect){const labels={joy:'喜悦',excitement:'兴奋',sadness:'悲伤',anger:'愤怒',confusion:'困惑',curiosity:'好奇',none:'暂无明确情绪'};$('mapping').textContent='照片回应分类：'+(labels[effect.selected_emotion]||effect.selected_emotion)+'；动作：'+(effect.motion.error==='ROBOT_NOT_READY'?'机器人尚未就绪':effect.motion.error||effect.motion.status);if(effect.motion.error==='ROBOT_NOT_READY')$('status').textContent='照片分析完成；机器人尚未就绪';}if(r.image_id)await showImage(r.image_id);if(['completed','failed','cancelled','interrupted'].includes(r.status)){clearInterval(timer);timer=null;job=null;busy(false);await history();await memories();}else if(r.result.reply){await history();}}catch(e){clearInterval(timer);timer=null;busy(false);$('error').textContent=e.message;}}
async function submit(kind,image_id=null){if(!sid)await newSession();const body={session_id:sid,request_id:crypto.randomUUID(),kind,text:$('text').value,image_id};busy(true);let r;try{r=await data('/jobs',{method:'POST',body:JSON.stringify(body)});}catch(e){busy(false);throw e;}job=r.id;$('status').textContent='已提交';clearInterval(timer);timer=setInterval(poll,900);await poll();}
action('connect',async()=>{token=$('token').value.trim();sessionStorage.setItem('agent-token',token);const h=await data('/health');$('healthText').textContent=JSON.stringify(h,null,2);if(sid){try{await history();}catch{await newSession();}}else await newSession();await memories();$('status').textContent='已连接';if(h.active_job_id){job=h.active_job_id;busy(true);timer=setInterval(poll,900);}});
action('new',newSession);action('capture',()=>submit('capture'));action('send',()=>submit('message',iid));action('upload',async()=>{const file=$('file').files[0];if(!file)throw Error('请先选择照片');if(!sid)await newSession();const form=new FormData();form.append('session_id',sid);form.append('image',file);const r=await data('/images',{method:'POST',body:form});await showImage(r.image_id);await submit('image',r.image_id);});
action('stop',async()=>{if(job)await data('/jobs/'+job+'/cancel',{method:'POST'});await poll();});action('refresh',memories);action('health',async()=>{$('healthText').textContent=JSON.stringify(await data('/health'),null,2);});
$('quiet').onchange=async()=>{try{await data('/sessions/'+sid+'/mode',{method:'PATCH',body:JSON.stringify({quiet:$('quiet').checked})});}catch(e){$('error').textContent=e.message;}};
</script></html>
